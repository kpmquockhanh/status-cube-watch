; Waveshare ESP32-S3-Touch-LCD-1.69
;   ESP32-S3R8 (8 MB octal PSRAM, 16 MB flash)
;   The R8's PSRAM is octal, so memory_type must be qio_opi. With the quad
;   setting (qio_qspi) the chip is not found, internal RAM is all there is, and
;   starting the setup-portal AP with BLE up runs out of memory and crashes in
;   the WiFi driver (LoadProhibited in ieee80211_hostap_attach).
;   240x280 ST7789V2 over SPI, CST816 capacitive touch over I2C
;
;   pio run -t upload && pio device monitor

[env:waveshare-s3-lcd169]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; Over the air, after the first USB flash: uncomment these, then plain
; `pio run -t upload` reaches the cube. --auth is the OTA password from the
; setup portal (drop the line if none is set).
; upload_protocol = espota
; upload_port = claude-cube.local
; upload_flags = --auth=YOUR_OTA_PASSWORD

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DLGFX_USE_V1
  -DCORE_DEBUG_LEVEL=1

lib_deps =
  lovyan03/LovyanGFX@^1.2.0
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^2.1.0

; Same firmware with BLE compiled out (WiFi polling only). A fallback while the
; BLE path is being brought up on hardware: `pio run -e waveshare-s3-lcd169-noble -t upload`.
[env:waveshare-s3-lcd169-noble]
extends = env:waveshare-s3-lcd169
build_flags =
  ${env:waveshare-s3-lcd169.build_flags}
  -DCUBE_NO_BLE
