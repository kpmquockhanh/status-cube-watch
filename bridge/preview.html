<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Cube Preview</title>
<style>
  :root {
    /* agents-deck's palette, the same tokens as the top of firmware/src/ui.cpp.
       Its one alarm colour is the accent, so red is the accent too. */
    --bg: #0a0a0a; --panel: #141412; --ink: #e8e4dc; --dim: #7a776f; --faint: #262622;
    --accent: #ff4d00; --blue: #6f8fd8; --green: #6dbe6a;
    --amber: #e8b94a; --violet: #a68bd8; --red: #ff4d00;
    --chip: #c98b6b; --track-wait: #b23600;
    --mono: "Roboto Mono", "Share Tech Mono", ui-monospace, Menlo, monospace;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 20px;
    background: var(--bg); color: var(--ink); padding: 32px 16px;
    font: 14px/1.5 var(--mono);
  }
  .wrap { display: grid; justify-items: center; gap: 14px; }
  /* Physical panel: 240x280 px, scaled up so it is readable on a desktop.
     Everything inside is positioned in real device pixels, so what you move
     here is what you move in firmware/src/ui.cpp. */
  .device {
    width: 240px; height: 280px; border-radius: 0; background: var(--bg);
    overflow: hidden; position: relative;
    transform: scale(1.6); transform-origin: top center; margin-bottom: 190px;
    box-shadow: 0 0 0 6px #1b1b18, 0 24px 60px #0008;
  }
  .bar {
    position: absolute; top: 13px; left: 14px; right: 14px; display: flex;
    justify-content: space-between; align-items: center;
    font-size: 9px; font-weight: 600; color: var(--dim); text-transform: uppercase;
    letter-spacing: 0;
  }
  .bar .fresh { display: flex; align-items: center; gap: 5px; font-weight: 500; letter-spacing: 0; }
  .bar i { width: 6px; height: 6px; border-radius: 0; background: var(--ink); }
  .bar i.off { background: var(--accent); }

  .ring { position: absolute; inset: 0; }
  /* The one piece of motion on the device, reproduced here so the mock and
     the panel agree: a sweep the first time a card is seen, and a shorter
     retarget whenever the number moves under it. */
  .arc {
    transition: stroke-dashoffset 260ms var(--ease-out), stroke 400ms var(--ease-out);
    animation: sweep 700ms var(--ease-out);
  }
  @keyframes sweep { from { stroke-dashoffset: 75; } }
  @media (prefers-reduced-motion: reduce) {
    .arc { animation: none; transition: stroke-dashoffset 200ms linear, stroke 400ms linear; }
  }

  .mid {
    position: absolute; top: 96px; left: 0; width: 240px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .mid .value {
    font-size: 28px; font-weight: 700; line-height: 1;
    letter-spacing: 0; font-variant-numeric: tabular-nums;
  }
  /* The bridge sends captions upper-case and the firmware lower-cases them
     (lowerCopy in ui.cpp), so the mock does too; only BLE/WIFI and the age
     label stay upper case. */
  .mid .cap { text-transform: lowercase;
    font-size: 8px; font-weight: 600; letter-spacing: 0;
    color: var(--dim);
  }
  .read {
    position: absolute; top: 186px; left: 0; width: 240px;
    display: flex; align-items: baseline; justify-content: center; gap: 6px;
  }
  .read .pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .read .label { text-transform: lowercase;
    font-size: 9px; font-weight: 500; letter-spacing: 0;
    color: var(--dim);
  }

  /* Text cards -- the optional spend deck, which has no percentage to fill a
     ring with -- keep the original big-number layout. */
  .device.text .ring, .device.text .read .pct { display: none; }
  .device.text .mid { top: 52px; gap: 0; }
  .device.text .mid .value { font-size: 76px; margin-top: 34px; }
  .device.text .mid .cap { font-size: 11px; letter-spacing: 0; color: var(--dim); margin-top: 30px; }
  .device.text .read { top: 230px; }
  /* The card's name sits at the bottom of a ring card (NAME_Y in ui.cpp), and
     under the top bar on a text card (drawTextCard draws it at y=60). */
  .name {
    text-transform: lowercase;
    position: absolute; top: 224px; left: 0; width: 240px; text-align: center;
    font-size: 9px; font-weight: 600; letter-spacing: 0; color: var(--dim);
  }
  .device.text .name { top: 60px; }

  /* The combined usage card (a card with `g2`): a second, inner ring for the 7d
     window, the session countdown in the middle, the unread-mail badge in the
     gap of the rings and a legend line per window. Positions are the DUAL_* /
     ROW* / MAIL_* numbers in drawDualCard in firmware/src/ui.cpp. */
  .device:not(.dual) .ring2, .device:not(.dual) .mail, .device:not(.dual) .rows { display: none; }
  .device.dual .read, .device.dual .name { display: none; }
  .device.dual .mid { top: 106px; gap: 10px; }
  .device.dual .mid .value { font-size: 24px; }
  .mail {
    position: absolute; top: 167px; left: 0; width: 240px; height: 18px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .mail:empty { display: none; }
  .mail svg { width: 16px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1; }
  .rows { position: absolute; top: 203px; left: 34px; right: 34px; }
  .rows .row { height: 22px; display: flex; align-items: center; }
  .rows .sw { width: 7px; height: 7px; border-radius: 0; margin-right: 6px; flex: none; }
  .rows .k { text-transform: lowercase; width: 25px; font-size: 9px; font-weight: 500; letter-spacing: 0; color: var(--dim); }
  .rows .p { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rows .r { margin-left: auto; font-size: 9px; font-weight: 500; letter-spacing: 0; color: var(--dim); }

  .dots { position: absolute; bottom: 12px; left: 0; width: 240px; display: flex; gap: 6px; justify-content: center; }
  .dots b { width: 5px; height: 5px; border-radius: 0; background: var(--faint); }
  .dots b.on { background: var(--ink); }
  .hint { color: var(--dim); font-size: 12px; text-align: center; max-width: 46ch; }
  .hint code { font-family: var(--mono); }
  .hint code { color: var(--ink); }
  .stale { color: var(--red); }
  /* A dual card's s2 (the full reason a limits read failed) is not drawn on
     the device; the mock shows it here, outside the panel. */
  /* The Agents card (a card with `a`): the firmware's grid (agents_layout.h:
     caption at y 44, view 54..254, two columns of 108x96 tiles) and, on a click
     on an orange tile, its prompt screen, drawn from `q` the way the full
     variant has it. The browser never answers: the buttons stay grey. Colours
     and copy mirror ui.cpp; the critter is a plain block. */
  .agentsview { display: none; position: absolute; inset: 0; }
  .device.agents .agentsview { display: block; }
  .device.agents .ring, .device.agents .mid, .device.agents .mail, .device.agents .rows, .device.agents .read, .device.agents .name { display: none; }
  .ag-cap { text-transform: lowercase; position: absolute; top: 36px; left: 0; width: 240px; text-align: center; font-size: 14px; font-weight: 700; }
  .ag-view { position: absolute; top: 54px; left: 0; width: 240px; height: 200px; overflow-y: auto; scrollbar-width: none; }
  .ag-view::-webkit-scrollbar { display: none; }
  .ag-grid { position: relative; }
  /* Tiles are 108 x 96 (TILE_W/TILE_H in agents_layout.h), square, with a 1 px
     line; the critter is a plain block and its hat a band in the hat's colour
     (`h` & 7, HAT_COLORS below). */
  .tile { position: absolute; width: 108px; height: 96px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--faint); overflow: hidden; text-align: center; }
  .tile.wait { background: var(--accent); border-color: var(--accent); color: var(--bg); cursor: pointer; }
  .tile.hungry { border-color: var(--accent); background: repeating-linear-gradient(135deg, var(--panel) 0 6px, #3a1a0a 6px 8px); }
  .tile .chip { position: absolute; top: 5px; right: 5px; width: 8px; height: 8px; background: var(--chip); }
  .tile.wait .chip { background: var(--bg); }
  .tile .n { position: absolute; left: 5px; right: 5px; top: 60px; font-size: 12px; font-weight: 700; line-height: 16px; white-space: nowrap; overflow: hidden; }
  .tile .l { position: absolute; left: 5px; right: 5px; top: 77px; font-size: 11px; line-height: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  .tile.idle .n, .tile.exit .n, .tile.start .n { color: var(--dim); }
  .tile.hungry .n { color: var(--ink); }
  .tile.hungry .l, .tile.err .l { color: var(--accent); }
  .tile.wait .l { color: var(--bg); }
  .tile .meter { position: absolute; left: 7px; right: 7px; bottom: 4px; height: 3px; background: var(--faint); }
  .tile .meter i { display: block; height: 100%; background: var(--ink); }
  .tile.idle .meter i, .tile.exit .meter i, .tile.start .meter i { background: var(--dim); }
  .tile.wait .meter { background: var(--track-wait); }
  .tile.wait .meter i { background: var(--bg); }
  .crit { position: absolute; left: 24px; top: 30px; width: 56px; height: 20px; background: var(--dim); }
  .crit::before, .crit::after { content: ""; position: absolute; top: 5px; width: 4px; height: 8px; background: var(--panel); }
  .crit::before { left: 16px; }
  .crit::after { right: 16px; }
  .tile.run .crit, .tile.hungry .crit { background: var(--accent); }
  .tile.err .crit { background: var(--ink); }
  .tile.wait .crit { background: var(--bg); }
  .tile.wait .crit::before, .tile.wait .crit::after { background: var(--accent); }
  .crit .hat { position: absolute; left: 12px; top: -8px; width: 32px; height: 8px; }
  /* The prompt screen is the cube's: all accent, black text, a black detail box,
     the first button solid black with accent text, the others a 2 px black
     outline, and a button that is off (the browser never answers, so all of
     them) black at 40 % (promptOff in ui.cpp). */
  .prompt { display: none; position: absolute; inset: 0; background: var(--accent); color: var(--bg); --off: #9d3204; }
  .device.prompting .prompt { display: block; }
  .device.prompting .ag-cap, .device.prompting .ag-view { display: none; }
  .pr-head { position: absolute; top: 34px; left: 14px; right: 14px; font-size: 14px; font-weight: 700; color: var(--bg); }
  .pr-col { position: absolute; top: 56px; left: 14px; right: 14px; bottom: 6px; overflow-y: auto; scrollbar-width: none; }
  .pr-col::-webkit-scrollbar { display: none; }
  .pr-title { font-size: 18px; font-weight: 700; line-height: 22px; margin-bottom: 8px; }
  .pr-detail { background: var(--bg); color: var(--ink); padding: 6px 8px; font-size: 12px; line-height: 15px; word-break: break-word; margin-bottom: 8px; }
  .pr-ctx, .pr-reason { font-size: 11px; color: var(--bg); margin-bottom: 6px; }
  .pr-notice { text-align: center; margin-top: 56px; }
  .pr-notice b { display: block; font-size: 18px; margin-bottom: 8px; }
  .pr-notice span { font-size: 12px; }
  .btn { display: flex; align-items: center; gap: 8px; height: 34px; margin-bottom: 6px; padding: 0 10px; border: 2px solid var(--off); color: var(--off); font-size: 12px; box-sizing: border-box; white-space: nowrap; overflow: hidden; }
  .btn.first { background: var(--off); color: var(--accent); }
  .btn i { flex: none; font-style: normal; font-size: 12px; width: 12px; }
  .btn.back { border-color: var(--bg); color: var(--bg); justify-content: center; cursor: pointer; }
  .note { color: var(--red); font-size: 12px; margin: 0; min-height: 1.5em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="device" id="device">
    <div class="bar"><span id="t"></span><span class="fresh" id="fresh">--<i id="led"></i></span></div>
    <!-- 270 degrees starting at 135, so the gap sits under the readout. The
         two notches are cut in the background colour at the amber and red
         thresholds; same numbers as RING_* in firmware/src/ui.cpp. -->
    <svg class="ring" width="240" height="280" viewBox="0 0 240 280" aria-hidden="true">
      <circle cx="120" cy="128" r="66.5" fill="none" stroke="#262622" stroke-width="13"
              pathLength="100" stroke-dasharray="75 100" transform="rotate(135 120 128)"></circle>
      <circle class="arc" id="arc" cx="120" cy="128" r="66.5" fill="none" stroke-width="13"
              pathLength="100" stroke-dasharray="75 100" stroke-dashoffset="75"
              transform="rotate(135 120 128)"></circle>
      <line class="notch" x1="147.24" y1="74.54" x2="153.14" y2="62.96" stroke="#0a0a0a" stroke-width="2"></line>
      <line class="notch" x1="179.82" y1="132.71" x2="192.77" y2="133.73" stroke="#0a0a0a" stroke-width="2"></line>
      <!-- inner ring of the combined usage card: r 47..55 (RING2_* in ui.cpp) -->
      <circle class="ring2" cx="120" cy="128" r="51" fill="none" stroke="#262622" stroke-width="8"
              pathLength="100" stroke-dasharray="75 100" transform="rotate(135 120 128)"></circle>
      <circle class="arc ring2" id="arc2" cx="120" cy="128" r="51" fill="none" stroke-width="8"
              pathLength="100" stroke-dasharray="75 100" stroke-dashoffset="75"
              transform="rotate(135 120 128)"></circle>
      <line class="notch ring2" x1="140.88" y1="87.01" x2="145.42" y2="78.10" stroke="#0a0a0a" stroke-width="2"></line>
      <line class="notch ring2" x1="165.86" y1="131.61" x2="175.83" y2="132.39" stroke="#0a0a0a" stroke-width="2"></line>
    </svg>
    <div class="mid">
      <div class="value" id="v">--</div>
      <div class="cap" id="s1">waiting for bridge</div>
    </div>
    <div class="agentsview" id="agentsview"><div class="ag-cap" id="agcap"></div><div class="ag-view" id="agview"><div class="ag-grid" id="aggrid"></div></div><div class="prompt" id="prompt"></div></div>
    <div class="mail" id="mail"></div>
    <div class="rows" id="rows"></div>
    <div class="read"><span class="pct" id="pct"></span><span class="label" id="s2"></span></div>
    <div class="name" id="nm"></div>
    <div class="dots" id="dots"></div>
  </div>
  <p class="note" id="note"></p>
  <p class="hint">
    Click the screen or press <code>&larr; &rarr;</code> to change card.
    This is the same payload the firmware renders, from <code>/api/status</code>.
  </p>
</div>
<script>
// agents-deck's hat colours, in the order of the payload's `h` (shape * 8 + colour).
const HAT_COLORS = ['#4fb3a6', '#6f8fd8', '#e8b94a', '#6dbe6a', '#a68bd8', '#e58bb0', '#5ec4d6', '#e8e4dc'];
const COLORS = { accent:'--accent', blue:'--blue', green:'--green', amber:'--amber', violet:'--violet', red:'--red', muted:'--dim' };
let data = null, idx = 0, lastFetch = 0;
let online = null; // unknown until the first poll settles

// With no cards the cube shows one "no data yet" card (drawWaitingCard in
// firmware/src/ui.cpp), so the deck is never empty. Approximated here as a
// text card with the same strings.
const WAITING = { t:'', v:'No data yet', s1:'', s2:'Waiting for the bridge', c:'ink' };
const cards = () => (data.cards.length ? data.cards : [WAITING]);

// ---- the Agents card -------------------------------------------------------
// Every field may be missing or odd (null tiles, `q.o` not an array): the page
// keeps drawing whatever the bridge sent.
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
let promptAgent = null; // the tile whose prompt screen is open

function paintAgents(card, color) {
  const tiles = card.a.filter((t) => t && typeof t === 'object');
  agcap.textContent = card.s1 || '';
  agcap.style.color = color;
  aggrid.style.height = `${tiles.length ? Math.ceil(tiles.length / 2) * 102 - 6 : 0}px`;
  aggrid.innerHTML = tiles.map((t, i) => {
    const k = ['run', 'wait', 'idle', 'err', 'exit', 'start'].includes(t.k) ? t.k : 'idle';
    const x = Math.max(0, Math.min(100, Number(t.x) || 0));
    // Hungry: an idle tile that finished a turn nobody looked at, or in the hungry pose.
    const hungry = k === 'idle' && (t.u || t.p === 'hungry');
    const hat = Number.isInteger(t.h) && t.h >= 0 && t.h < 104
      ? `<span class="hat" style="background:${HAT_COLORS[t.h % 8]}"></span>` : '';
    return `<div class="tile ${k}${hungry ? ' hungry' : ''}" data-id="${esc(t.i)}" style="left:${i & 1 ? 123 : 9}px;top:${Math.floor(i / 2) * 102}px">` +
      `<span class="chip"></span><div class="n">${esc(t.n)}</div><div class="crit">${hat}</div>` +
      `<div class="l">${esc(t.l)}</div><div class="meter"><i style="width:${x}%"></i></div></div>`;
  }).join('');
  const open = promptAgent && tiles.find((t) => String(t.i) === promptAgent && t.k === 'wait');
  if (promptAgent && !open) promptAgent = null; // gone or no longer waiting: close, as AgentView does
  if (!open) return;
  device.classList.add('prompting');
  // Which screen, as AgentView decides it. A payload without `q` is what the
  // cube sees over WiFi (or when the budget dropped it, `qc`).
  const q = card.q && typeof card.q === 'object' ? card.q : null;
  const head = `<div class="pr-head">${esc(open.n)}</div>`;
  const notice = (a, b) => `${head}<div class="pr-col"><div class="pr-notice"><b>${a}</b><span>${b}</span></div></div>`;
  if (!q) {
    prompt.innerHTML = card.qc ? notice('too long for the cube', 'answer at the terminal') : notice('needs you', 'open on Bluetooth');
    return;
  }
  if (String(q.i) !== String(open.i)) {
    const other = tiles.find((t) => String(t.i) === String(q.i));
    prompt.innerHTML = notice('needs you', `answer ${esc(other ? other.n : 'the other agent')} first`);
    return;
  }
  const opts = q.k === 'input' || !Array.isArray(q.o) ? [] : q.o.filter((o) => o && typeof o === 'object');
  const reason = q.k === 'input' ? 'answer at the terminal' : q.x === 'tmux' ? 'not in tmux' : 'answer on the cube';
  const detail = q.cut ? '(detail cut)' : q.d;
  prompt.innerHTML = `${head}<div class="pr-col"><div class="pr-title">${esc(q.t)}</div>` +
    (detail ? `<div class="pr-detail" style="${q.cut ? 'color:var(--dim)' : ''}">${esc(detail)}</div>` : '') +
    (q.c ? `<div class="pr-ctx">${esc(q.c)}</div>` : '') +
    `<div class="pr-reason">${esc(reason)}</div>` +
    opts.map((o, n) => `<div class="btn${n ? '' : ' first'}"><i>${esc(o.k)}</i>${esc(o.l)}</div>`).join('') +
    '<div class="btn back" id="pback">back</div></div>';
  document.getElementById('pback').onclick = (ev) => { ev.stopPropagation(); promptAgent = null; paint(); };
}

aggrid.addEventListener('click', (ev) => {
  const t = ev.target.closest && ev.target.closest('.tile.wait');
  if (!t) return;
  ev.stopPropagation();
  promptAgent = t.dataset.id;
  paint();
});

function paint() {
  if (!data) return;
  const deck = cards();
  const card = deck[idx % deck.length];
  if (!Array.isArray(card.a)) promptAgent = null;
  const color = `var(${COLORS[card.c] || '--ink'})`;
  // A card with `g` is a ring; anything else keeps the big-number layout.
  const gauge = typeof card.g === 'number';
  const dual = gauge && typeof card.g2 === 'number';
  const agents = Array.isArray(card.a);
  device.classList.toggle('agents', agents);
  device.classList.toggle('text', !gauge);
  device.classList.toggle('dual', dual);

  // The top bar carries no name (drawTopBar: battery left, age right; the
  // battery is not mocked). The name is drawn below the bar on a text card
  // and at the bottom of a ring.
  nm.textContent = card.t;
  v.textContent = card.v;
  v.style.color = gauge ? 'var(--ink)' : color;
  s1.textContent = card.s1 || '';
  s2.textContent = card.s2 || '';
  note.textContent = dual && card.s2 ? `${card.t}: ${card.s2}` : '';

  device.classList.remove('prompting');
  if (agents) paintAgents(card, color);

  if (gauge) {
    const pctVal = Math.max(0, Math.min(100, card.g));
    // 75 of the circle's 100 path units are the arc, so the offset eats into
    // it from the far end: 0 is a full ring, 75 an empty one.
    arc.style.strokeDashoffset = card.g < 0 ? 75 : (75 * (1 - pctVal / 100)).toFixed(2);
    arc.style.stroke = color;
    pct.textContent = card.g < 0 ? '' : `${pctVal}%`;
    pct.style.color = color;
  }

  if (dual) {
    const col2 = `var(${COLORS[card.c2] || '--ink'})`;
    arc2.style.strokeDashoffset = card.g2 < 0 ? 75 : (75 * (1 - Math.min(100, card.g2) / 100)).toFixed(2);
    arc2.style.stroke = col2;
    const esc = (x) => String(x ?? '').replace(/[&<>]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[ch]));
    mail.innerHTML = card.m
      ? `<svg viewBox="0 0 16 11" aria-hidden="true"><rect x=".5" y=".5" width="15" height="10" rx="2"/><path d="M2.5 2.5 8 6.5l5.5-4"/></svg><span>${esc(card.m)}</span>`
      : '';
    mail.style.color = `var(${COLORS[card.mc] || '--ink'})`;
    rows.innerHTML = (card.rows || []).map((r, i) =>
      `<div class="row"><i class="sw" style="background:${i ? col2 : color}"></i><span class="k">${esc(r.k)}</span><span class="p">${esc(r.p)}</span><span class="r">${esc(r.r)}</span></div>`).join('');
  }

  dots.innerHTML = deck.map((_, i) => `<b class="${i === idx ? 'on' : ''}"></b>`).join('');
  tick();
}

// The device shows how old the reading is rather than a clock, because it has
// no NTP sync and what matters is whether the number is current. Mirrors
// ageLabel (firmware/src/age_label.h) and the red-at-30s rule in drawTopBar.
function ageLabel(s) {
  if (!online) return 'OFF';
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 100 * 3600) return `${Math.floor(s / 3600)}h`;
  return 'OLD';
}
function tick() {
  if (online === null) return;
  const s = Math.floor((Date.now() - lastFetch) / 1000);
  const stale = !online || s >= 30;
  fresh.firstChild.textContent = ageLabel(s);
  fresh.className = 'fresh' + (stale ? ' stale' : '');
  led.className = stale ? 'off' : '';
}

async function poll() {
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    data = await res.json();
    lastFetch = Date.now();
    online = true;
    paint();
  } catch (e) {
    online = false;
    tick();
  }
}

device.onclick = (ev) => {
  if (ev.target.closest && ev.target.closest('.ag-view,.prompt')) return;
  if (data) { idx = (idx + 1) % cards().length; paint(); } };
addEventListener('keydown', (e) => {
  if (!data) return;
  const n = cards().length;
  if (e.key === 'ArrowRight') idx = (idx + 1) % n;
  else if (e.key === 'ArrowLeft') idx = (idx - 1 + n) % n;
  else return;
  paint();
});
setInterval(() => { if (data && !promptAgent) { idx = (idx + 1) % cards().length; paint(); } }, 6000);
setInterval(tick, 1000);
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
