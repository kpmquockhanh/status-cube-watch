<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Cube Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #0b0d12; --ink: #e7ecf5; --dim: #7c8598; --faint: #2a3242;
    --accent: #ff8a5b; --blue: #5b9dff; --green: #46d08a;
    --amber: #f5c451; --violet: #b18cff; --red: #ff6b6b;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 20px;
    background: var(--bg); color: var(--ink); padding: 32px 16px;
    font: 14px/1.5 Archivo, system-ui, sans-serif;
  }
  .wrap { display: grid; justify-items: center; gap: 14px; }
  /* Physical panel: 240x280 px, scaled up so it is readable on a desktop.
     Everything inside is positioned in real device pixels, so what you move
     here is what you move in firmware/src/ui.cpp. */
  .device {
    width: 240px; height: 280px; border-radius: 22px; background: #000;
    overflow: hidden; position: relative;
    transform: scale(1.6); transform-origin: top center; margin-bottom: 190px;
    box-shadow: 0 0 0 6px #1b1f28, 0 24px 60px #0008;
  }
  .bar {
    position: absolute; top: 13px; left: 14px; right: 14px; display: flex;
    justify-content: space-between; align-items: center;
    font-size: 9px; font-weight: 600; color: var(--dim);
    letter-spacing: .22em; text-transform: uppercase;
  }
  .bar .fresh { display: flex; align-items: center; gap: 5px; font-weight: 500; letter-spacing: .1em; }
  .bar i { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .bar i.off { background: var(--red); }

  .ring { position: absolute; inset: 0; }
  /* The one piece of motion on the device, reproduced here so the mock and
     the panel agree: a sweep the first time a card is seen, and a shorter
     retarget whenever the number moves under it. */
  .arc {
    transition: stroke-dashoffset 260ms var(--ease-out), stroke 400ms var(--ease-out);
    animation: sweep 700ms var(--ease-out);
  }
  @keyframes sweep { from { stroke-dashoffset: 75; } }
  @media (prefers-reduced-motion: reduce) {
    .arc { animation: none; transition: stroke-dashoffset 200ms linear, stroke 400ms linear; }
  }

  .mid {
    position: absolute; top: 96px; left: 0; width: 240px;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .mid .value {
    font-size: 28px; font-weight: 700; line-height: 1;
    letter-spacing: -.01em; font-variant-numeric: tabular-nums;
  }
  /* The bridge sends these in sentence case; the device uppercases them
     when it draws, so the mock has to as well or the two disagree. */
  .mid .cap {
    font-size: 8px; font-weight: 600; letter-spacing: .24em;
    color: var(--dim); text-transform: uppercase;
  }
  .read {
    position: absolute; top: 186px; left: 0; width: 240px;
    display: flex; align-items: baseline; justify-content: center; gap: 6px;
  }
  .read .pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .read .label {
    font-size: 9px; font-weight: 500; letter-spacing: .16em;
    color: var(--dim); text-transform: uppercase;
  }

  /* Text cards -- the optional spend deck, which has no percentage to fill a
     ring with -- keep the original big-number layout. */
  .device.text .ring, .device.text .read .pct { display: none; }
  .device.text .mid { top: 52px; gap: 0; }
  .device.text .mid .value { font-size: 76px; margin-top: 34px; }
  .device.text .mid .cap { font-size: 11px; letter-spacing: 0; color: #aab4c6; margin-top: 30px; }
  .device.text .read { top: 230px; }
  /* The card's name sits at the bottom of a ring card (NAME_Y in ui.cpp). */
  .name {
    position: absolute; top: 224px; left: 0; width: 240px; text-align: center;
    font-size: 9px; font-weight: 600; letter-spacing: .22em; color: var(--dim);
    text-transform: uppercase;
  }
  .device.text .name { display: none; }
  /* The Pomodoro card: a ring that is time left, so no percentage and no
     threshold notches (see drawPomodoroCard in firmware/src/ui.cpp). */
  .device.nopct .read .pct { display: none; }
  .device.nonotch .notch { display: none; }

  .dots { position: absolute; bottom: 12px; left: 0; width: 240px; display: flex; gap: 6px; justify-content: center; }
  .dots b { width: 5px; height: 5px; border-radius: 50%; background: var(--faint); }
  .dots b.on { background: var(--ink); }
  .hint { color: var(--dim); font-size: 12px; text-align: center; max-width: 46ch; }
  .hint code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .hint code { color: var(--ink); }
  .stale { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <div class="device" id="device">
    <div class="bar"><span id="t">CONNECTING</span><span class="fresh" id="fresh">--<i id="led"></i></span></div>
    <!-- 270 degrees starting at 135, so the gap sits under the readout. The
         two notches are cut in the background colour at the amber and red
         thresholds; same numbers as RING_* in firmware/src/ui.cpp. -->
    <svg class="ring" width="240" height="280" viewBox="0 0 240 280" aria-hidden="true">
      <circle cx="120" cy="128" r="66.5" fill="none" stroke="#2a3242" stroke-width="13"
              pathLength="100" stroke-dasharray="75 100" transform="rotate(135 120 128)"></circle>
      <circle class="arc" id="arc" cx="120" cy="128" r="66.5" fill="none" stroke-width="13"
              pathLength="100" stroke-dasharray="75 100" stroke-dashoffset="75"
              transform="rotate(135 120 128)"></circle>
      <line class="notch" x1="147.24" y1="74.54" x2="153.14" y2="62.96" stroke="#000" stroke-width="2"></line>
      <line class="notch" x1="179.82" y1="132.71" x2="192.77" y2="133.73" stroke="#000" stroke-width="2"></line>
    </svg>
    <div class="mid">
      <div class="value" id="v">--</div>
      <div class="cap" id="s1">waiting for bridge</div>
    </div>
    <div class="read"><span class="pct" id="pct"></span><span class="label" id="s2"></span></div>
    <div class="name" id="nm"></div>
    <div class="dots" id="dots"></div>
  </div>
  <p class="hint">
    Click the screen or press <code>&larr; &rarr;</code> to change card.
    This is the same payload the firmware renders, from <code>/api/status</code>.
  </p>
</div>
<script>
const COLORS = { accent:'--accent', blue:'--blue', green:'--green', amber:'--amber', violet:'--violet', red:'--red', muted:'--dim' };
let data = null, idx = 0, lastFetch = 0;

// The Pomodoro card is local to the device (firmware/src/pomodoro.cpp), so it
// is not in /api/status. The mock shows fixed fake timer data; pick the state
// with ?pomo=ready|focus|paused|break|done.
const POMO = {
  ready:  { v:'25:00', s1:'Ready',      s2:'0/4  Hold to start',  c:'muted', g:100 },
  focus:  { v:'17:57', s1:'Focus',      s2:'0/4  Hold to pause',  c:'amber', g:72 },
  paused: { v:'17:57', s1:'Paused',     s2:'0/4  Hold to resume', c:'muted', g:72 },
  break:  { v:'03:30', s1:'Break',      s2:'1/4  Hold to pause',  c:'green', g:70 },
  done:   { v:'Done',  s1:'Focus done', s2:'1/4  Hold for break', c:'amber', g:0 },
};
const pomoState = new URLSearchParams(location.search).get('pomo');
const pomoCard = { t:'Pomodoro', local:true, ...(POMO[pomoState] || POMO.ready) };
const cards = () => data.cards.concat([pomoCard]);

function paint() {
  if (!data) return;
  const deck = cards();
  const card = deck[idx % deck.length];
  const color = `var(${COLORS[card.c] || '--ink'})`;
  // A card with `g` is a ring; anything else keeps the big-number layout.
  const gauge = typeof card.g === 'number';
  device.classList.toggle('text', !gauge);
  device.classList.toggle('nopct', !!card.local);
  device.classList.toggle('nonotch', !!card.local);

  // A ring card names itself at the bottom; a text card keeps it in the bar.
  t.textContent = gauge ? '' : card.t;
  nm.textContent = gauge ? card.t : '';
  v.textContent = card.v;
  v.style.color = gauge ? 'var(--ink)' : color;
  s1.textContent = card.s1 || '';
  s2.textContent = card.s2 || '';

  if (gauge) {
    const pctVal = Math.max(0, Math.min(100, card.g));
    // 75 of the circle's 100 path units are the arc, so the offset eats into
    // it from the far end: 0 is a full ring, 75 an empty one.
    arc.style.strokeDashoffset = card.g < 0 ? 75 : (75 * (1 - pctVal / 100)).toFixed(2);
    arc.style.stroke = color;
    pct.textContent = card.g < 0 ? '' : `${pctVal}%`;
    pct.style.color = color;
  }

  dots.innerHTML = deck.map((_, i) => `<b class="${i === idx ? 'on' : ''}"></b>`).join('');
  tick();
}

// The device shows how old the reading is rather than a clock, because it has
// no NTP sync and what matters is whether the number is current.
function tick() {
  if (!lastFetch) return;
  const s = Math.round((Date.now() - lastFetch) / 1000);
  const stale = s > 20;
  fresh.firstChild.textContent = s < 60 ? `${s}s` : `${Math.round(s / 60)}m`;
  fresh.className = 'fresh' + (stale ? ' stale' : '');
  led.className = stale ? 'off' : '';
}

async function poll() {
  try {
    const res = await fetch('/api/status', { cache: 'no-store' });
    data = await res.json();
    lastFetch = Date.now();
    paint();
  } catch (e) {
    fresh.firstChild.textContent = 'offline';
    fresh.className = 'fresh stale';
    led.className = 'off';
  }
}

device.onclick = () => { if (data) { idx = (idx + 1) % cards().length; paint(); } };
addEventListener('keydown', (e) => {
  if (!data) return;
  const n = cards().length;
  if (e.key === 'ArrowRight') idx = (idx + 1) % n;
  else if (e.key === 'ArrowLeft') idx = (idx - 1 + n) % n;
  else return;
  paint();
});
setInterval(() => { if (data) { idx = (idx + 1) % cards().length; paint(); } }, 6000);
setInterval(tick, 1000);
poll();
setInterval(poll, 5000);
</script>
</body>
</html>
