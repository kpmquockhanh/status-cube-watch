<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<title>agents</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-1 -3 16 16' shape-rendering='crispEdges'%3E%3Cpath d='M2 0h10v1h1v1h1v2h-1v2h-1v1h-10v-1h-1v-2h-1v-2h1v-1h1z' fill='%23FF4D00'/%3E%3Crect x='4' y='2' width='1' height='2' fill='%230A0A0A'/%3E%3Crect x='9' y='2' width='1' height='2' fill='%230A0A0A'/%3E%3Cpath d='M2 7h1v2h-1zM4 7h1v2h-1zM9 7h1v2h-1zM11 7h1v2h-1z' fill='%23FF4D00'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/board/board.css">
<script type="module" src="/board/board.js"></script>
</head>
<body>
<header class="top">
  <div class="top-left">
    <span class="wordmark">agents</span>
    <ul class="counts" aria-label="agent counts">
      <li><b id="n-running">0</b> running</li>
      <li id="c-waiting"><b id="n-waiting">0</b> waiting</li>
      <li><b id="n-idle">0</b> idle</li>
      <li id="c-error"><b id="n-error">0</b> error</li>
    </ul>
  </div>
  <div class="top-right">
    <span class="conn" id="conn" role="status" aria-live="polite"><i class="dot" aria-hidden="true"></i><span id="conn-label">connecting…</span></span>
    <time id="clock" class="clock">--:--</time>
  </div>
</header>

<div id="banner" class="banner" role="alert" hidden>bridge not answering · showing last known state · retrying…</div>

<div class="layout">
  <main class="main" aria-label="agents">
    <div id="grid" class="grid" aria-label="agent tiles" tabindex="-1"></div>
    <div id="empty" class="empty" hidden>
      <span class="empty-art" id="empty-art" aria-hidden="true"></span>
      <p id="empty-text">no agents running</p>
    </div>
  </main>
  <aside id="detail" class="detail" aria-label="agent detail" hidden></aside>
</div>

<noscript><p class="empty">this board needs javascript.</p></noscript>
</body>
</html>
