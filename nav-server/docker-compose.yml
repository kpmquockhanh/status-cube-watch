services:
  graphhopper:
    image: nav-graphhopper:11.1
    restart: unless-stopped
    mem_limit: 3500m
    # The whole data dir is mounted (not the graph symlink) because refresh.sh flips it.
    command: ["java", "-Xmx3g", "-Ddw.graphhopper.graph.location=/data/graph", "-jar", "graphhopper-web-11.1.jar", "server", "config.yml"]
    volumes:
      - /root/nav/data:/data   # rw: GraphHopper needs to create gh.lock in the graph dir

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Replaces the image's default.conf, so only nav.devxdev.site is served.
      - /root/nav-server/nginx/include/00-nav-include.conf:/etc/nginx/conf.d/default.conf:ro
      - /root/nav-server/nginx:/etc/nginx/nav:ro
      - /root/nav/nginx-key:/etc/nginx/nav-key:ro
      - /root/nav/data:/srv/nav-data:ro
      - /root/nav/certbot/conf:/etc/letsencrypt:ro
      - /root/nav/certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - /root/nav/certbot/conf:/etc/letsencrypt
      - /root/nav/certbot/www:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'
