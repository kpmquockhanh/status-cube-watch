<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route lab</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0B0D12; --surface: #151922; --high: #1E2430; --hair: rgba(255,255,255,.08);
    --ink: #E7ECF5; --dim: #98A1B3; --accent: #FF8A5B;
    --calm: #46D08A; --fastest: #4DA3FF; --turns: #F5C451; --bad: #FF6B6B;
    --main: #FF6B6B; --mid: #C9A0FF; --alley: #46D08A; --other: #7C8598;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 380px 1fr; }
  aside { overflow-y: auto; padding: 16px; border-right: 1px solid var(--hair); display: flex; flex-direction: column; gap: 14px; }
  #map { height: 100%; }
  h1 { font-size: 18px; margin: 0; }
  .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
  .seg { display: flex; background: var(--surface); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; border-radius: 8px; padding: 7px 8px; background: none; color: var(--dim); font: inherit; cursor: pointer; }
  .seg button.on { background: var(--high); color: var(--ink); }
  .seg button:disabled { opacity: .4; cursor: default; }
  select, input[type=text] { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--hair);
    border-radius: 10px; padding: 8px 10px; font: inherit; }
  .hint { color: var(--dim); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--hair); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .btn:hover { background: var(--high); }
  .card { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 12px; cursor: pointer; }
  .card.focus { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .card .name { font-weight: 600; flex: 1; }
  .card .time { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .prof { color: var(--dim); font-size: 12px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 10px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stats div { font-size: 12px; color: var(--dim); }
  .stats b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
  .phone { margin-top: 8px; font-size: 12px; padding: 3px 8px; border-radius: 6px; display: inline-block; background: var(--high); }
  .phone.hidden { color: var(--bad); }
  .err { color: var(--bad); margin-top: 6px; font-size: 13px; }
  .verdict { display: flex; gap: 6px; margin-top: 8px; }
  .verdict input { flex: 1; padding: 6px 8px; }
  .verdict .good:hover { border-color: var(--calm); } .verdict .bad:hover { border-color: var(--bad); }
  .toggle { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--dim); }
  .legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .vlist { display: flex; flex-direction: column; gap: 6px; }
  .vitem { background: var(--surface); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 13px; }
  .vitem:hover { background: var(--high); }
  .vitem .meta { color: var(--dim); font-size: 12px; }
  .pin { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px;
    color: #0B0D12; border: 2px solid #0B0D12; }
  .turn { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #0B0D12; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; border: 2px solid #0B0D12; }
  .light { width: 12px; height: 12px; border-radius: 50%; background: #FF4D4D; border: 2px solid #FFD84D; }
  .leaflet-container { background: var(--bg); }
  /* OSM's light tiles, turned dark so the route colours read as in the app. */
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.4); }
  .leaflet-tooltip { background: var(--high); color: var(--ink); border: 0; }
  .leaflet-tooltip:before { display: none; }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: 50vh auto; }
    #map { grid-row: 1; } aside { grid-row: 2; border-right: 0; }
  }
</style>
</head>
<body>
<aside>
  <h1>Route lab</h1>
  <div>
    <div class="label">Server</div>
    <div class="seg" id="servers"></div>
  </div>
  <div>
    <div class="label">Trip</div>
    <select id="trip"></select>
    <div class="row" style="margin-top:6px">
      <span class="hint" style="flex:1">Click the map: start, then end. Drag A or B to move them.</span>
      <button class="btn" id="swap" title="Swap start and end">⇅ Swap</button>
    </div>
  </div>
  <div>
    <div class="label">Calm uses</div>
    <div class="seg" id="rush">
      <button data-v="0">Normal</button><button data-v="1">Rush hour</button>
    </div>
  </div>
  <div class="row" style="justify-content:space-between">
    <label class="toggle"><input type="checkbox" id="roadTypes" checked> Colour picked route by road type</label>
  </div>
  <div class="legend">
    <span><i style="background:var(--main)"></i>main (primary, trunk)</span>
    <span><i style="background:var(--mid)"></i>secondary, tertiary</span>
    <span><i style="background:var(--alley)"></i>alley, residential</span>
    <span><i style="background:var(--other)"></i>other</span>
  </div>
  <div id="cards" style="display:flex;flex-direction:column;gap:10px"></div>
  <div>
    <div class="label">Verdicts (<span id="vcount">0</span>)</div>
    <div class="vlist" id="vlist"></div>
  </div>
</aside>
<div id="map"></div>
<script>
// Mirrors the app (NavCore): styles, profiles, stats, detour limit and merged rows.
const STYLES = [
  { key: 'calm', title: 'Calm', color: 'var(--calm)', hex: '#46D08A', profile: (rush) => rush ? 'moto_calm_rush' : 'moto_calm' },
  { key: 'fastest', title: 'Fastest', color: 'var(--fastest)', hex: '#4DA3FF', profile: () => 'moto_vn' },
  { key: 'fewestTurns', title: 'Fewest turns', color: 'var(--turns)', hex: '#F5C451', profile: () => 'moto_turns' },
];
const MAIN = new Set(['primary', 'trunk']);
const MID = new Set(['secondary', 'tertiary']);
const ALLEY = new Set(['residential', 'service', 'living_street', 'unclassified']);
// GraphHopper signs the app counts as turns: left, right, sharp, U-turn, roundabout.
const TURN_SIGNS = new Map([[-2, 'L'], [2, 'R'], [-3, 'L'], [3, 'R'], [-98, 'U'], [-8, 'U'], [8, 'U'], [6, '↻'], [-6, '↻']]);
const DETOUR_SHARE = 1.2, DETOUR_S = 300, SAME_PCT = 1.02, SAME_M = 25, END_STRETCH_M = 300;
const ROAD_HEX = { main: '#FF6B6B', mid: '#C9A0FF', alley: '#46D08A', other: '#7C8598' };

const state = { server: 'local', rush: false, from: null, to: null, trip: '', focus: 'calm', results: {}, seq: 0 };
let config, verdictRows = [];

const map = L.map('map', { zoomControl: true }).setView([21.02, 105.83], 13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const markLayer = L.layerGroup().addTo(map);
const pin = (label, bg) => L.divIcon({ className: '', html: `<div class="pin" style="background:${bg}">${label}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] });
let markerA = null, markerB = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function hav([lon1, lat1], [lon2, lat2]) {
  const r = Math.PI / 180;
  const a = Math.sin((lat2 - lat1) * r / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin((lon2 - lon1) * r / 2) ** 2;
  return 2 * 6371008.8 * Math.asin(Math.sqrt(a));
}

function roadKind(cls) {
  const c = String(cls).toLowerCase();
  return MAIN.has(c) ? 'main' : MID.has(c) ? 'mid' : ALLEY.has(c) ? 'alley' : 'other';
}

function stats(path) {
  const pts = path.points.coordinates;
  const seg = pts.slice(1).map((p, i) => hav(pts[i], p));
  const total = seg.reduce((a, b) => a + b, 0);
  const startOf = [0]; for (const d of seg) startOf.push(startOf.at(-1) + d);
  let main = 0, alley = 0, middle = 0;
  for (const [f, t, v] of path.details?.road_class ?? []) for (let i = f; i < t; i++) {
    const k = roadKind(v);
    if (k === 'main') main += seg[i];
    const m = startOf[i] + seg[i] / 2;
    if (m < END_STRETCH_M || m > total - END_STRETCH_M) continue;
    middle += seg[i]; if (k === 'alley') alley += seg[i];
  }
  const signals = path.details?.crossing;
  return {
    time: path.time / 1000, km: path.distance / 1000,
    turns: path.instructions.filter((i) => TURN_SIGNS.has(i.sign)).length,
    lights: signals ? signals.filter((d) => String(d[2]).toLowerCase() === 'traffic_signals').length : null,
    mainPct: total ? 100 * main / total : 0, alleyPct: middle ? 100 * alley / middle : 0,
  };
}

// RouteOptions.swift: distances within 2% and every point within 25 m of the other line.
function distToLine([plon, plat], line) {
  const kx = 111194.9266 * Math.cos(plat * Math.PI / 180), ky = 111194.9266;
  const xy = ([lon, lat]) => [(lon - plon) * kx, (lat - plat) * ky];
  let [ax, ay] = xy(line[0]), best = Math.hypot(ax, ay);
  for (const c of line.slice(1)) {
    const [bx, by] = xy(c), dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    const t = l2 > 0 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
    [ax, ay] = [bx, by];
  }
  return best;
}
function sameRoute(a, b) {
  if (Math.max(a.distance, b.distance) > SAME_PCT * Math.min(a.distance, b.distance)) return false;
  const pa = a.points.coordinates, pb = b.points.coordinates;
  return pa.every((p) => distToLine(p, pb) <= SAME_M) && pb.every((p) => distToLine(p, pa) <= SAME_M);
}

// What the phone's list would show for each style: shown, hidden as a detour, or merged into a row.
function phoneRows() {
  const out = {}, rows = [], f = state.results.fastest?.path;
  for (const s of STYLES) {
    const p = state.results[s.key]?.path;
    if (!p) continue;
    if (f && s.key !== 'fastest' && p.time / 1000 > DETOUR_SHARE * f.time / 1000 && (p.time - f.time) / 1000 > DETOUR_S) {
      out[s.key] = { hidden: true, text: `Hidden on the phone: detour, +${Math.round((p.time - f.time) / 60000)} min` };
      continue;
    }
    const row = rows.find((r) => sameRoute(r.path, p));
    if (row) out[s.key] = { hidden: false, text: `Merged into the ${row.title} row (same route)` };
    else { rows.push({ path: p, title: s.title }); out[s.key] = { hidden: false, text: 'Shown on the phone' }; }
  }
  return out;
}

function rushNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' })
    .formatToParts(new Date()).map((p) => [p.type, p.value]));
  if (['Sat', 'Sun'].includes(parts.weekday)) return false;
  const m = Number(parts.hour) * 60 + Number(parts.minute);
  return (m >= 420 && m < 540) || (m >= 990 && m < 1140);
}

function renderSeg(el, items, current, onPick) {
  el.innerHTML = items.map((it) => `<button data-v="${it.v}" ${it.disabled ? 'disabled' : ''} title="${esc(it.title || '')}">${esc(it.label)}</button>`).join('');
  for (const b of el.children) {
    b.classList.toggle('on', b.dataset.v === String(current));
    b.onclick = () => onPick(b.dataset.v);
  }
}

function renderControls() {
  renderSeg($('servers'), Object.entries(config.servers).map(([k, s]) => ({
    v: k, label: k === 'local' ? 'Local' : 'Live', disabled: !s.ready,
    title: s.ready ? s.url : `${s.url} (start the lab with NAV_KEY=... to use it)`,
  })), state.server, (v) => { state.server = v; renderControls(); plan(); });
  renderSeg($('rush'), [{ v: 0, label: 'Normal' }, { v: 1, label: 'Rush hour' }], state.rush ? 1 : 0,
    (v) => { state.rush = v === '1'; renderControls(); plan(); });
  $('trip').value = state.trip;
}

function setPoints(from, to, trip = '') {
  state.from = from; state.to = to; state.trip = trip;
  $('trip').value = trip;
  for (const m of [markerA, markerB]) if (m) map.removeLayer(m);
  markerA = markerB = null;
  if (from) markerA = dragPin('A', '#46D08A', from, (p) => { state.from = p; state.trip = ''; $('trip').value = ''; plan(); });
  if (to) markerB = dragPin('B', '#FF8A5B', to, (p) => { state.to = p; state.trip = ''; $('trip').value = ''; plan(); });
  syncHash();
}

// The trip in the address, so a reload or a pasted link shows the same trip.
function syncHash() {
  const f = state.from, t = state.to;
  history.replaceState(null, '', f && t ? `#from=${f[1].toFixed(6)},${f[0].toFixed(6)}&to=${t[1].toFixed(6)},${t[0].toFixed(6)}` : '#');
}

function dragPin(label, bg, [lon, lat], onMove) {
  const m = L.marker([lat, lon], { icon: pin(label, bg), draggable: true, zIndexOffset: 1000 }).addTo(map);
  m.on('dragend', () => { const ll = m.getLatLng(); onMove([ll.lng, ll.lat]); });
  return m;
}

map.on('click', (e) => {
  const p = [e.latlng.lng, e.latlng.lat];
  if (!state.from || state.to) { setPoints(p, null); state.results = {}; draw(); renderCards(); }
  else { setPoints(state.from, p); plan(); }
});

async function plan(fit = false) {
  if (!state.from || !state.to) return;
  const seq = ++state.seq;
  syncHash();
  state.results = Object.fromEntries(STYLES.map((s) => [s.key, { loading: true, profile: s.profile(state.rush) }]));
  renderCards(); draw();
  await Promise.all(STYLES.map(async (s) => {
    const profile = s.profile(state.rush);
    let result;
    try {
      const r = await fetch('/api/route', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ server: state.server, profile, from: state.from, to: state.to }) });
      const j = await r.json();
      result = r.ok ? { profile, path: j.paths[0], took: j.info?.took, wall: j.wall } : { profile, error: j.message };
    } catch (e) { result = { profile, error: e.message }; }
    if (seq !== state.seq) return;
    if (result.path) result.stats = stats(result.path);
    state.results[s.key] = result;
    renderCards(); draw();
  }));
  if (seq === state.seq && fit) fitRoutes();
}

function fitRoutes() {
  const ll = Object.values(state.results).flatMap((r) => r.path ? r.path.points.coordinates.map(([lon, lat]) => [lat, lon]) : []);
  if (ll.length) map.fitBounds(ll, { padding: [40, 40] });
}

function draw() {
  routeLayer.clearLayers(); markLayer.clearLayers();
  const order = STYLES.filter((s) => s.key !== state.focus).concat(STYLES.filter((s) => s.key === state.focus));
  for (const s of order) {
    const r = state.results[s.key];
    if (!r?.path) continue;
    const ll = r.path.points.coordinates.map(([lon, lat]) => [lat, lon]);
    const focused = s.key === state.focus;
    if (!focused) {
      L.polyline(ll, { color: s.hex, weight: 4, opacity: 0.55 }).addTo(routeLayer)
        .on('click', () => { state.focus = s.key; renderCards(); draw(); }).bindTooltip(s.title, { sticky: true });
      continue;
    }
    L.polyline(ll, { color: '#0B0D12', weight: 11, opacity: 0.9 }).addTo(routeLayer);
    if ($('roadTypes').checked) {
      for (const [f, t, v] of r.path.details?.road_class ?? [])
        L.polyline(ll.slice(f, t + 1), { color: ROAD_HEX[roadKind(v)], weight: 7, opacity: 1 })
          .bindTooltip(`${s.title}: ${String(v).toLowerCase()}`, { sticky: true }).addTo(routeLayer);
    } else {
      L.polyline(ll, { color: s.hex, weight: 7 }).addTo(routeLayer);
    }
    for (const [f, , v] of r.path.details?.crossing ?? [])
      if (String(v).toLowerCase() === 'traffic_signals')
        L.marker(ll[f], { icon: L.divIcon({ className: '', html: '<div class="light"></div>', iconSize: [12, 12], iconAnchor: [6, 6] }) })
          .bindTooltip('Traffic light').addTo(markLayer);
    let n = 0;
    for (const ins of r.path.instructions) {
      const tag = TURN_SIGNS.get(ins.sign);
      if (!tag) continue;
      n += 1;
      L.marker(ll[ins.interval[0]], { icon: L.divIcon({ className: '', html: `<div class="turn">${tag}</div>`, iconSize: [18, 18], iconAnchor: [9, 9] }) })
        .bindTooltip(`Turn ${n}: ${esc(ins.text)}`).addTo(markLayer);
    }
  }
}

const fmtMin = (s) => `${Math.round(s / 60)} min`;

function renderCards() {
  const phone = phoneRows();
  $('cards').innerHTML = STYLES.map((s) => {
    const r = state.results[s.key];
    let body = '';
    if (!state.from || !state.to) body = '<div class="hint" style="margin-top:6px">Pick a trip or click the map.</div>';
    else if (!r || r.loading) body = '<div class="hint" style="margin-top:6px">Routing…</div>';
    else if (r.error) body = `<div class="err">${esc(r.error)}</div>`;
    else {
      const st = r.stats, ph = phone[s.key];
      body = `
        <div class="stats">
          <div><b>${st.km.toFixed(1)} km</b>distance</div>
          <div><b>${st.turns}</b>turns</div>
          <div><b>${st.lights ?? '–'}</b>lights</div>
          <div><b>${st.mainPct.toFixed(0)}%</b>main roads</div>
          <div><b>${st.alleyPct.toFixed(0)}%</b>alleys mid-trip</div>
          <div><b>${Math.round(r.took ?? 0)} ms</b>server time</div>
        </div>
        <div class="phone ${ph?.hidden ? 'hidden' : ''}">${esc(ph?.text ?? '')}</div>
        <div class="verdict" onclick="event.stopPropagation()">
          <input type="text" placeholder="Note (optional)" data-note="${s.key}">
          <button class="btn good" data-verdict="good" data-style="${s.key}" title="Good route">👍</button>
          <button class="btn bad" data-verdict="bad" data-style="${s.key}" title="Bad route">👎</button>
        </div>`;
    }
    const time = r?.stats ? fmtMin(r.stats.time) : '';
    return `<div class="card ${state.focus === s.key ? 'focus' : ''}" style="--c:${s.color}" data-focus="${s.key}">
      <div class="top"><span class="dot"></span><span class="name">${s.title}</span><span class="time">${time}</span></div>
      <div class="prof">${esc(r?.profile ?? s.profile(state.rush))}</div>${body}</div>`;
  }).join('');
  for (const c of $('cards').querySelectorAll('[data-focus]'))
    c.onclick = () => { state.focus = c.dataset.focus; renderCards(); draw(); };
  for (const b of $('cards').querySelectorAll('[data-verdict]'))
    b.onclick = () => saveVerdict(b.dataset.style, b.dataset.verdict, b);
}

async function saveVerdict(styleKey, verdict, button) {
  const r = state.results[styleKey];
  const note = $('cards').querySelector(`[data-note="${styleKey}"]`).value.trim();
  const row = { server: state.server, trip: state.trip || null, from: state.from, to: state.to, rush: state.rush,
    style: styleKey, profile: r.profile, verdict, note, stats: r.stats };
  button.disabled = true;
  const res = await fetch('/api/verdicts', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(row) });
  button.disabled = false;
  if (!res.ok) { alertRow(button, 'Not saved'); return; }
  verdictRows.push(await res.json());
  renderVerdicts();
  alertRow(button, 'Saved');
}

function alertRow(button, text) {
  const old = button.textContent;
  button.textContent = text;
  setTimeout(() => { button.textContent = old; }, 1200);
}

function renderVerdicts() {
  $('vcount').textContent = verdictRows.length;
  const titles = Object.fromEntries(STYLES.map((s) => [s.key, s.title]));
  $('vlist').innerHTML = verdictRows.slice(-30).reverse().map((v, i) => `
    <div class="vitem" data-i="${verdictRows.length - 1 - i}">
      ${v.verdict === 'good' ? '👍' : '👎'} <b>${esc(titles[v.style] ?? v.style)}</b> · ${esc(v.trip ?? 'custom trip')}${v.note ? ` — ${esc(v.note)}` : ''}
      <div class="meta">${esc(v.server)} · ${esc(v.profile)} · ${new Date(v.ts).toLocaleString()}</div>
    </div>`).join('') || '<div class="hint">None yet. Rate a route with 👍 or 👎; they are saved to route-lab/verdicts.jsonl.</div>';
  for (const el of $('vlist').querySelectorAll('[data-i]')) el.onclick = () => {
    const v = verdictRows[Number(el.dataset.i)];
    if (config.servers[v.server]?.ready) state.server = v.server;
    state.rush = v.rush; state.focus = v.style;
    renderControls(); setPoints(v.from, v.to, v.trip ?? ''); plan(true);
  };
}

function fromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  const p = (s) => { const [lat, lon] = (s || '').split(',').map(Number); return Number.isFinite(lat) && Number.isFinite(lon) ? [lon, lat] : null; };
  return [p(h.get('from')), p(h.get('to'))];
}

$('trip').onchange = () => {
  const t = config.trips.find((t) => t.name === $('trip').value);
  if (t) { setPoints(t.from, t.to, t.name); plan(true); }
};
$('swap').onclick = () => { if (state.from && state.to) { setPoints(state.to, state.from, ''); plan(); } };
$('roadTypes').onchange = draw;

(async () => {
  config = await (await fetch('/api/config')).json();
  verdictRows = await (await fetch('/api/verdicts')).json();
  $('trip').innerHTML = '<option value="">Custom (click the map)</option>'
    + config.trips.map((t) => `<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');
  state.rush = rushNow();
  renderControls(); renderVerdicts();
  const [from, to] = fromHash();
  const near = (a, b) => Math.abs(a[0] - b[0]) < 1e-5 && Math.abs(a[1] - b[1]) < 1e-5;
  const named = from && to && config.trips.find((t) => near(t.from, from) && near(t.to, to));
  if (from && to) { setPoints(from, to, named?.name ?? ''); plan(true); }
  else { const t = config.trips[0]; setPoints(t.from, t.to, t.name); plan(true); }
})();
</script>
