# Mounted at /etc/nginx/conf.d/nav.conf in the n8n nginx container (http context).
include /etc/nginx/nav-key.conf;   # map $http_x_nav_key $nav_key_ok
limit_req_zone $binary_remote_addr zone=navtiles:10m rate=10r/s;

server {
    listen 80;
    server_name nav.devxdev.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nav.devxdev.site;

    ssl_certificate     /etc/letsencrypt/live/nav.devxdev.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nav.devxdev.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;
    client_max_body_size 64k;

    # Docker DNS; GraphHopper is resolved per request so nginx starts while it is down.
    resolver 127.0.0.11 valid=30s;
    set $gh http://graphhopper:8989;

    if ($nav_key_ok = 0) { return 401; }

    location = /route {
        proxy_pass $gh;
        proxy_read_timeout 30s;
    }
    location = /health {
        proxy_pass $gh;
    }
    location /tiles/ {
        limit_req zone=navtiles burst=200 nodelay;
        alias /srv/nav-data/tiles/;
        gzip_static on;
        default_type application/json;
    }
}
